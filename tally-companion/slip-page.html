<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2F5E">
<title>Dispatch Slip</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231B2F5E'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
<style>
  :root { --navy:#1B2F5E; --red:#A81E24; --green:#13693A; --ink:#1F2937; --muted:#6B7280; --rule:#D9DEE7; --band:#F1F5F9; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {
    font:17px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff;
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { background:var(--navy); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:19px; font-weight:600; }
  main { flex:1; padding:18px; max-width:620px; width:100%; margin:0 auto; }

  /* The bill is chosen for you. Changing it is the rare case, so it is a link,
     not another control to read past. */
  .bill { border:2px solid var(--navy); border-radius:12px; padding:14px 16px; }
  .bill .no { font-size:26px; font-weight:700; color:var(--navy); line-height:1.1; }
  .bill .party { font-size:17px; margin-top:4px; }
  .bill .amt { font-size:15px; color:var(--muted); margin-top:2px; }
  .change { display:inline-block; margin-top:10px; font-size:15px; color:var(--red); text-decoration:underline; cursor:pointer; }

  /* One target, impossible to miss, reachable with a thumb. */
  .snap {
    display:block; width:100%; margin-top:20px; padding:30px 16px;
    font-size:21px; font-weight:700; color:#fff; background:var(--navy);
    border:0; border-radius:14px; cursor:pointer; text-align:center;
  }
  .snap:disabled { background:#9AA6BC; }
  .snap .cam { display:block; font-size:40px; margin-bottom:6px; }

  #preview { margin-top:16px; display:none; text-align:center; }
  #preview img { max-width:100%; max-height:46vh; border:1px solid var(--rule); border-radius:10px; }

  #done { display:none; margin-top:20px; padding:20px; border-radius:12px; background:#E7F6EC; color:var(--green); }
  #done b { display:block; font-size:21px; margin-bottom:8px; }
  #done .next { color:var(--ink); font-size:17px; }
  #done .next kbd { background:#fff; border:1px solid var(--rule); border-radius:5px; padding:2px 7px; font:inherit; font-weight:700; }
  #err { display:none; margin-top:16px; padding:14px 16px; border-radius:10px; background:#FDECEC; color:var(--red); }
  .again { display:block; width:100%; margin-top:16px; padding:15px; font-size:17px; font-weight:600;
           color:var(--navy); background:#fff; border:2px solid var(--navy); border-radius:12px; cursor:pointer; }

  #picker { display:none; margin-top:14px; }
  label { display:block; font-size:14px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  select, input[type=text] { width:100%; padding:14px 12px; font-size:17px; border:1px solid var(--rule); border-radius:8px; background:#fff; }

  .waiting { margin-top:26px; font-size:14px; color:var(--muted); }
  .waiting ul { margin:6px 0 0; padding-left:20px; }
</style>
</head>
<body>
<header><h1>Dispatch Slip</h1></header>

<main>
  <div class="bill">
    <div class="no" id="billNo">loading…</div>
    <div class="party" id="billParty"></div>
    <div class="amt" id="billAmt"></div>
    <span class="change" id="change">change bill</span>
  </div>

  <div id="picker">
    <label for="vch">Recent bills</label>
    <select id="vch"></select>
    <label for="manual">…or type the number</label>
    <input type="text" id="manual" inputmode="numeric" placeholder="e.g. 441" autocomplete="off">
  </div>

  <button class="snap" id="snap">
    <span class="cam">📷</span>
    Photo of slip
  </button>
  <!-- capture=environment opens the rear camera straight away on a phone. On a
       desktop browser the attribute is ignored and this is a normal file picker,
       so one page serves both. -->
  <input type="file" id="file" accept="image/*" capture="environment" hidden>

  <div id="preview"><img id="img" alt="slip just taken"></div>
  <div id="err"></div>

  <div id="done">
    <b>Slip saved ✓</b>
    <div class="next">Now in Tally press <kbd>Alt</kbd>+<kbd>J</kbd> and answer <kbd>Yes</kbd>.</div>
    <button class="again" id="again">Another slip</button>
  </div>

  <div class="waiting" id="waiting"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
// The token lives in the saved bookmark, and every call back to the companion
// has to carry it - without it the wifi could write slips onto any bill.
const KEY = new URLSearchParams(location.search).get("k") || "";
const api = (p) => p + (KEY ? (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY) : "");

let bills = [];
let chosen = "";

function showBill() {
  const b = bills.find((x) => x.voucherNumber === chosen);
  $("billNo").textContent = chosen || "—";
  $("billParty").textContent = b ? b.party : "";
  $("billAmt").textContent = b && b.amount ? "Rs. " + b.amount : "";
  $("snap").disabled = !chosen;
}

function fail(message) {
  $("err").textContent = message;
  $("err").style.display = "block";
}

$("change").onclick = () => {
  $("picker").style.display = $("picker").style.display === "block" ? "none" : "block";
};
$("vch").onchange = () => { chosen = $("vch").value; showBill(); };
$("manual").oninput = () => { chosen = $("manual").value.trim(); showBill(); };

$("snap").onclick = () => $("file").click();
$("file").onchange = (e) => { if (e.target.files[0]) upload(e.target.files[0]); };
$("again").onclick = () => {
  $("done").style.display = "none";
  $("preview").style.display = "none";
  $("file").value = "";
  load();
};

// Uploading starts the moment the photo is taken. Asking for a second tap on an
// "Upload" button is one more thing to forget while holding a parcel.
async function upload(file) {
  $("err").style.display = "none";
  if (file.size > 8 * 1024 * 1024) return fail("That photo is over 8 MB. Take it again at a lower size.");

  const reader = new FileReader();
  reader.onload = () => { $("img").src = reader.result; $("preview").style.display = "block"; };
  reader.readAsDataURL(file);

  $("snap").disabled = true;
  $("snap").innerHTML = "Saving…";
  try {
    const base64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const resp = await fetch(api("/slip"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voucherNumber: chosen, fileName: file.name || "slip.jpg", base64 }),
    });
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.message || "Upload failed.");
    $("done").style.display = "block";
    $("done").scrollIntoView({ behavior: "smooth", block: "center" });
    pending();
  } catch (e) {
    fail("Could not save it: " + e.message);
  }
  $("snap").disabled = false;
  $("snap").innerHTML = '<span class="cam">📷</span>Photo of slip';
}

// The newest bill is the one being dispatched almost every time, so it is
// already chosen when the page opens.
async function load() {
  try {
    const r = await fetch(api("/recent-vouchers"));
    bills = await r.json();
  } catch {
    bills = [];
  }
  const sel = $("vch");
  sel.innerHTML = "";
  for (const b of bills) {
    const o = document.createElement("option");
    o.value = b.voucherNumber;
    o.textContent = b.voucherNumber + " · " + b.party;
    sel.appendChild(o);
  }
  if (bills.length) {
    chosen = bills[0].voucherNumber;
    sel.value = chosen;
  } else {
    $("billNo").textContent = "—";
    $("picker").style.display = "block";
    fail("Could not reach Tally. Type the bill number.");
  }
  showBill();
  pending();
}

async function pending() {
  try {
    const list = await (await fetch(api("/pending-slips"))).json();
    $("waiting").innerHTML = list.length
      ? "Waiting to be sent:<ul>" + list.map((s) => "<li>" + s.name + "</li>").join("") + "</ul>"
      : "";
  } catch { /* leave it */ }
}

load();
</script>
</body>
</html>
