<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1B2F5E">
<title>Dispatch Slip</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%231B2F5E'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif'%3E%F0%9F%93%B7%3C/text%3E%3C/svg%3E">
<style>
  :root { --navy:#1B2F5E; --red:#A81E24; --green:#13693A; --ink:#1F2937; --muted:#6B7280; --rule:#D9DEE7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100%; }
  body {
    font:17px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header { background:var(--navy); color:#fff; padding:14px 18px; position:sticky; top:0; z-index:5; }
  header h1 { margin:0; font-size:19px; font-weight:600; }
  main { padding:14px 16px 40px; max-width:640px; margin:0 auto; }

  /* Which bills to show. Today is the answer almost every time, so it leads. */
  .filters { display:flex; gap:8px; margin-bottom:14px; }
  .filters button {
    flex:1; padding:11px 6px; font-size:15px; font-weight:600; cursor:pointer;
    color:var(--navy); background:#fff; border:2px solid var(--rule); border-radius:10px;
  }
  .filters button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }

  .bill {
    display:flex; align-items:center; gap:12px; width:100%; text-align:left; cursor:pointer;
    padding:14px; margin-bottom:10px; background:#fff;
    border:2px solid var(--rule); border-radius:12px;
  }
  .bill.has { border-color:#BFE3CD; background:#F4FBF6; }
  .bill .left { flex:1; min-width:0; }
  .bill .no { font-size:19px; font-weight:700; color:var(--navy); }
  .bill .party { font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bill .amt { font-size:14px; color:var(--muted); }
  .tag { flex:none; font-size:13px; font-weight:700; padding:7px 10px; border-radius:8px; text-align:center; }
  .tag.add { color:#fff; background:var(--navy); }
  .tag.has { color:var(--green); background:#E7F6EC; }

  .note { color:var(--muted); font-size:15px; padding:10px 2px; }
  .typed { margin-top:22px; }
  label { display:block; font-size:14px; font-weight:600; color:var(--muted); margin-bottom:6px; }
  input[type=text] { width:100%; padding:13px 12px; font-size:17px; border:1px solid var(--rule); border-radius:8px; }

  /* Full-screen sheet: looking at a slip, confirming one, or sending. */
  #sheet { display:none; position:fixed; inset:0; background:#fff; z-index:10; overflow:auto;
           padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet h2 { font-size:19px; margin:16px 0 4px; color:var(--navy); }
  #sheet .sub { color:var(--muted); font-size:15px; margin-bottom:14px; }
  #sheet img { width:100%; border:1px solid var(--rule); border-radius:10px; }
  .act { display:block; width:100%; margin-top:12px; padding:16px; font-size:17px; font-weight:700;
         border-radius:12px; cursor:pointer; border:2px solid var(--navy); }
  .act.go { color:#fff; background:var(--navy); }
  .act.plain { color:var(--navy); background:#fff; }
  .ok { margin:14px 0; padding:16px; border-radius:12px; background:#E7F6EC; color:var(--green); }
  .ok b { display:block; font-size:19px; margin-bottom:6px; }
  .ok span { color:var(--ink); font-size:16px; }
  .ok kbd { background:#fff; border:1px solid var(--rule); border-radius:5px; padding:2px 7px; font:inherit; font-weight:700; }
  #err { display:none; margin:12px 0; padding:13px 15px; border-radius:10px; background:#FDECEC; color:var(--red); }
</style>
</head>
<body>
<header><h1>Dispatch Slip</h1></header>

<main>
  <div class="filters">
    <button data-days="0" aria-pressed="true">Today</button>
    <button data-days="7" aria-pressed="false">7 days</button>
    <button data-days="99" aria-pressed="false">All</button>
  </div>

  <div id="list"><div class="note">Loading bills…</div></div>
  <div id="err"></div>

  <div class="typed">
    <label for="manual">Bill not listed? Type its number</label>
    <input type="text" id="manual" inputmode="numeric" placeholder="e.g. 441" autocomplete="off">
  </div>
</main>

<div id="sheet"></div>

<!-- capture=environment opens the rear camera straight away on a phone. A
     desktop browser ignores it and shows a normal file picker, so one page
     serves the counter and the till. -->
<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script>
const $ = (id) => document.getElementById(id);
// The token lives in the bookmark saved on the phone. Every call carries it;
// without it the shop wifi could write slips onto any bill or send one.
const KEY = new URLSearchParams(location.search).get("k") || "";
const api = (p) => p + (KEY ? (p.includes("?") ? "&" : "?") + "k=" + encodeURIComponent(KEY) : "");
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

let bills = [];
let days = 0;
let target = null;

const ymd = (d) => d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();

function fail(message) {
  $("err").textContent = message;
  $("err").style.display = "block";
}

function sheet(html) {
  $("sheet").innerHTML = html;
  $("sheet").style.display = "block";
  $("sheet").scrollTop = 0;
}

function hide() {
  $("sheet").style.display = "none";
  $("sheet").innerHTML = "";
}

function visible() {
  if (days > 90) return bills;
  const cut = new Date();
  cut.setDate(cut.getDate() - days);
  return bills.filter((b) => Number(b.date || 0) >= ymd(cut));
}

function draw() {
  const rows = visible();
  const box = $("list");

  if (!bills.length) {
    box.innerHTML = '<div class="note">No bills loaded. Type the number below.</div>';
    return;
  }
  if (!rows.length) {
    box.innerHTML = '<div class="note">No bills ' +
      (days === 0 ? "today" : "in the last " + days + " days") + ". Try a wider range above.</div>";
    return;
  }

  box.innerHTML = "";
  for (const b of rows) {
    const has = Boolean(b.slip);
    const row = document.createElement("button");
    row.className = "bill" + (has ? " has" : "");
    row.innerHTML =
      '<span class="left">' +
        '<span class="no">' + esc(b.voucherNumber) + "</span><br>" +
        '<span class="party">' + esc(b.party) + "</span><br>" +
        '<span class="amt">' + (b.amount ? "Rs. " + esc(b.amount) : "") + "</span>" +
      "</span>" +
      '<span class="tag ' + (has ? "has" : "add") + '">' +
        (has ? (b.slip.state === "sent" ? "✓ Sent" : "✓ Slip<br>added") : "📷 Add<br>photo") +
      "</span>";
    row.onclick = () => (has ? view(b) : shoot(b));
    box.appendChild(row);
  }
}

// A bill that already has a slip opens the photo rather than the camera:
// "is it done, and is it the right one" is the question being asked.
function view(b) {
  const sent = b.slip.state === "sent";
  sheet(
    "<h2>" + esc(b.voucherNumber) + "</h2>" +
    '<div class="sub">' + esc(b.party) + " · " +
      (sent ? "slip already sent" : "slip waiting to be sent") + "</div>" +
    '<img src="' + api("/slip-image?v=" + encodeURIComponent(b.voucherNumber)) + '" alt="slip on this bill">' +
    (sent ? "" : '<button class="act go" id="send">Send on WhatsApp now</button>') +
    '<button class="act plain" id="retake">Replace with a new photo</button>' +
    '<button class="act plain" id="close">Close</button>'
  );
  if (!sent) $("send").onclick = () => send(b);
  $("retake").onclick = () => { hide(); shoot(b); };
  $("close").onclick = hide;
}

// One confirmation, because this messages a customer and costs money. The
// native dialog is deliberate: impossible to tap through by accident, and it
// needs no markup of its own.
async function send(b) {
  if (!confirm("Send invoice " + b.voucherNumber + " on WhatsApp to " + b.party + "?")) return;

  sheet("<h2>" + esc(b.voucherNumber) + '</h2><div class="sub">Sending…</div>');
  try {
    const resp = await fetch(api("/send"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voucherNumber: b.voucherNumber, partyLedgerName: b.party }),
    });
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.message || "Could not send.");
    sheet(
      "<h2>" + esc(b.voucherNumber) + "</h2>" +
      '<div class="ok"><b>On its way ✓</b><span>Going to ' + esc(b.party) + ". " +
        "If Tally is closed right now it waits in the queue and sends itself once Tally is open." +
      "</span></div>" +
      '<button class="act go" id="close">Done</button>'
    );
    $("close").onclick = () => { hide(); load(); };
  } catch (e) {
    hide();
    fail("Could not send: " + e.message);
  }
}

// A bill picked from the list carries its party, which a send needs. A number
// typed by hand does not, so that path can attach a slip but not send.
function shoot(bill) {
  target = typeof bill === "string" ? { voucherNumber: bill, party: "" } : bill;
  $("err").style.display = "none";
  $("file").value = "";
  $("file").click();
}

$("file").onchange = (e) => { if (e.target.files[0]) upload(e.target.files[0]); };

$("manual").onchange = () => {
  const typed = $("manual").value.trim();
  if (typed) shoot(typed);
};

for (const btn of document.querySelectorAll(".filters button")) {
  btn.onclick = () => {
    days = Number(btn.dataset.days);
    for (const other of document.querySelectorAll(".filters button")) {
      other.setAttribute("aria-pressed", String(other === btn));
    }
    draw();
  };
}

// A phone camera produces 4-5 MB per shot. That is slow on shop wifi and it
// lands in a PDF the customer then downloads on mobile data. 1600px reads a
// handwritten slip perfectly well.
function shrink(file) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    // A photo the browser cannot decode still deserves to reach the customer,
    // so fall back to sending it untouched.
    img.onerror = () => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(",")[1]);
      r.readAsDataURL(file);
    };
    img.src = URL.createObjectURL(file);
  });
}

async function upload(file) {
  sheet("<h2>" + esc(target.voucherNumber) + '</h2><div class="sub">Saving the photo…</div>');
  try {
    const base64 = await shrink(file);
    const resp = await fetch(api("/slip"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ voucherNumber: target.voucherNumber, fileName: "slip.jpg", base64 }),
    });
    const body = await resp.json();
    if (!resp.ok) throw new Error(body.message || "Upload failed.");

    sheet(
      "<h2>" + esc(target.voucherNumber) + "</h2>" +
      '<div class="ok"><b>Slip saved ✓</b><span>' +
        (target.party
          ? "Send it now, or press <kbd>Alt</kbd>+<kbd>J</kbd> on this bill in Tally and answer <kbd>Yes</kbd>."
          : "Now in Tally press <kbd>Alt</kbd>+<kbd>J</kbd> on this bill and answer <kbd>Yes</kbd>.") +
      "</span></div>" +
      '<img src="' + api("/slip-image?v=" + encodeURIComponent(target.voucherNumber)) + '" alt="the slip just saved">' +
      (target.party ? '<button class="act go" id="sendnow">Send on WhatsApp now</button>' : "") +
      '<button class="act plain" id="close">Done</button>'
    );
    if (target.party) $("sendnow").onclick = () => send(target);
    $("close").onclick = () => { hide(); load(); };
  } catch (e) {
    hide();
    fail("Could not save it: " + e.message);
  }
}

async function load() {
  try {
    bills = await (await fetch(api("/recent-vouchers"))).json();
  } catch {
    bills = [];
    fail("Could not reach the till PC. Is it switched on?");
  }
  // An empty "Today" is a blank screen with nothing to tap, so widen it rather
  // than leave him looking at it.
  if (days === 0 && bills.length && !visible().length) {
    document.querySelector('.filters button[data-days="7"]').click();
    return;
  }
  draw();
}

load();
</script>
</body>
</html>
